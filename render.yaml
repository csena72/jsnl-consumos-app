services:
  # Backend NestJS REST API
  - type: web
    name: jsnl-consumos-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migration:run:prod && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jsnl-consumos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production

  # Frontend Web React (Vite)
  - type: web
    name: jsnl-consumos-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA: las rutas de React Router (/reclamos, /exportar) deben servir index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Blueprints no pueden leer la URL pública de otro servicio (fromService solo expone
      # host/port internos). Es la URL por defecto de Render para el servicio jsnl-consumos-api;
      # si Render le asigna otro subdominio, actualizá este valor.
      - key: VITE_API_URL
        value: https://jsnl-consumos-api.onrender.com

databases:
  # PostgreSQL Managed Database (Plan Gratis)
  - name: jsnl-consumos-db
    databaseName: consumos_app
    user: admin_tacural
    region: oregon
    plan: free
